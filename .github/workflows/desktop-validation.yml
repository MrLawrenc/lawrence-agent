name: Desktop validation
on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths:
      - 'monitor-*/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'monitor-app/**'
      - 'monitor-core/**'
      - 'monitor-model/**'
      - 'monitor-agent/**'
      - 'monitor-cli/**'
      - 'scripts/desktop-soak/**'
      - 'scripts/package-candidate.py'
      - 'scripts/generate-native-icons.py'
      - 'scripts/ui-preview/**'
      - 'scripts/diagnostics-preview/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/desktop-validation.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        scale: ['1.0', '1.5']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 fonts-noto-cjk
      - name: Shared core and lifecycle verification
        shell: bash
        run: ./gradlew check --console=plain --max-workers=1
      - name: Linux JavaFX verification
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a ./gradlew :monitor-app:uiPreview --args=--verify :monitor-app:diagnosticsPreview "-PuiScale=${{ matrix.scale }}" --console=plain --max-workers=1
      - name: macOS JavaFX verification
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew :monitor-app:uiPreview --args=--verify :monitor-app:diagnosticsPreview "-PuiScale=${{ matrix.scale }}" --console=plain --max-workers=1
      - name: Windows JavaFX verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat :monitor-app:uiPreview --args=--verify :monitor-app:diagnosticsPreview "-PuiScale=${{ matrix.scale }}" --console=plain --max-workers=1
      - name: Build platform release candidate
        if: matrix.scale == '1.0'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/package-candidate.py --output build/platform-candidate
          else
            python3 scripts/package-candidate.py --output build/platform-candidate
          fi
      - name: Preserve platform candidate
        if: success() && matrix.scale == '1.0'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.os }}
          path: build/platform-candidate
          retention-days: 7
      - name: Preserve renders and checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.scale }}
          path: |
            monitor-app/build/ui-preview
            **/build/test-results
          retention-days: 7
