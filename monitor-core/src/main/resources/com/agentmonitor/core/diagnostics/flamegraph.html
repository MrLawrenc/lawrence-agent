<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFR 性能剖析</title>
<style>
:root{color-scheme:light dark;font:15px system-ui;background:#f5f6f8;color:#202735}body{margin:24px}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:8px;border:1px solid #718096;border-radius:6px;background:#fff;color:#202735}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #1767a8;outline-offset:2px}p{max-width:75ch;line-height:1.6}svg{width:100%;min-width:650px;display:block}#chart{overflow:auto;margin-top:24px}text{font:12px ui-monospace,monospace;fill:#17202c}rect:hover{stroke:#10263a;stroke-width:2}#info{min-height:48px;overflow-wrap:anywhere}::selection{background:#b7d7f0;color:#132335}@media(prefers-color-scheme:dark){:root{background:#161c24;color:#e2e8f0}button,select,input{background:#222d3a;color:#e2e8f0}text{fill:#17202c}}@media(max-width:600px){body{margin:16px}input{max-width:90%}}
</style>
<h1>JFR 性能剖析</h1><p>横向宽度表示当前事件的采样数、分配字节或等待纳秒。点击栈帧放大；Tab 可选择栈帧，Enter 放大。CPU 采样不等于方法精确耗时，ThreadPark 也可能来自正常等待。</p>
<nav aria-label="剖析控制"><label>事件 <select id="mode" aria-label="事件类型"></select></label><label>搜索 <input id="search" placeholder="类名或方法名" type="search"></label><button id="reset">回到全部调用栈</button></nav><p id="info" role="status"></p><div id="chart"></div>
<script>
const data=/*PROFILE_DATA*/{};const labels={cpu_samples:'CPU · 采样数',allocation_bytes:'对象分配 · 字节',lock_wait_nanos:'锁与 park · 纳秒',io_wait_nanos:'I/O 等待 · 纳秒'};let focus='';const mode=document.getElementById('mode'),search=document.getElementById('search'),chart=document.getElementById('chart'),info=document.getElementById('info');for(const k of Object.keys(data)){let o=document.createElement('option');o.value=k;o.textContent=labels[k]||k;mode.append(o)}
function draw(){chart.replaceChildren();const root={name:'全部',value:0,children:new Map()};const query=search.value.toLowerCase();for(const [stack,value] of Object.entries(data[mode.value]||{})){if(focus&&stack!==focus&&!stack.startsWith(focus+';'))continue;if(query&&!stack.toLowerCase().includes(query))continue;let n=root;n.value+=value;for(const name of stack.split(';')){if(!n.children.has(name))n.children.set(name,{name,value:0,children:new Map()});n=n.children.get(name);n.value+=value}}
info.textContent=root.value?'总量 '+root.value.toLocaleString()+' · '+(labels[mode.value]||''):'当前条件没有采样数据。请更换事件或清空搜索。';if(!root.value)return;const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('role','img');svg.setAttribute('aria-label','可放大的采样调用栈火焰图');let maxDepth=0,shown=0;function render(n,x,w,depth,path){maxDepth=Math.max(maxDepth,depth);if(w<1||depth>128||shown++>12000)return;let g=document.createElementNS(ns,'g'),r=document.createElementNS(ns,'rect'),t=document.createElementNS(ns,'text'),title=document.createElementNS(ns,'title');r.setAttribute('x',x);r.setAttribute('y',depth*26);r.setAttribute('width',Math.max(0,w-1));r.setAttribute('height',24);let hash=0;for(const c of n.name)hash=(hash*31+c.charCodeAt(0))|0;r.setAttribute('fill',`hsl(${25+Math.abs(hash)%35} 78% ${65+Math.abs(hash)%10}%)`);title.textContent=n.name+' · '+n.value.toLocaleString();g.append(r,title);if(w>50){t.setAttribute('x',x+4);t.setAttribute('y',depth*26+17);t.textContent=n.name.slice(0,Math.floor(w/7)-1);g.append(t)}g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',title.textContent);const zoom=()=>{focus=path;draw()};g.onclick=zoom;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom()}};g.onmouseenter=()=>{info.textContent=title.textContent};svg.append(g);let offset=x;for(const child of [...n.children.values()].sort((a,b)=>b.value-a.value)){let cw=w*child.value/n.value;render(child,offset,cw,depth+1,path?path+';'+child.name:child.name);offset+=cw}}render(root,0,1200,0,'');svg.setAttribute('viewBox',`0 0 1200 ${(maxDepth+1)*26}`);chart.append(svg)}mode.onchange=()=>{focus='';draw()};search.oninput=draw;document.getElementById('reset').onclick=()=>{focus='';search.value='';draw()};draw();
</script></html>
